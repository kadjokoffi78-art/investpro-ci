<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVESTPRO CI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .register {
      background: #15803d;
      color: white;
    }

    .login {
      background: white;
      color: #15803d;
      border: 2px solid #15803d;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🇨🇮 INVESTPRO CI</div>

    <div class="subtitle">
      Bienvenue sur votre espace
    </div>

    <a class="btn register" href="/inscription.html">
      Créer un compte
    </a>

    <a class="btn login" href="/connexion.html">
      Se connecter
    </a>

    <footer>
      INVESTPRO CI • FCFA (XOF)
    </footer>

  </div>

</body>
</html>
